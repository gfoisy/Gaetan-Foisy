---
styles:
- styles/gallery.css
---
<div class="background-colored">
  <div class="heading">
    <h1>A <span>gallery</span> of some old photos.</h1>
  </div>
</div>

<!-- Photos come from _data/gallery.yml -->
<div class="image-panes">
  {%- for photo in site.data.gallery %}
  <div class="pane">
    <img class="image" src="{{ page.root }}{{ photo.image }}" alt="{{ photo.alt | default: photo.caption | escape }}">
    <p>{{ photo.caption }}</p>
  </div>
  {%- endfor %}
</div>
