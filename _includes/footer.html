<footer{% if page.footer_id %} id="{{ page.footer_id }}"{% endif %}>
  <div class="inner-footer">
    <h2>Contact me</h2>
    <nav class="contact">
      <ul class="contactUl">
        <li><a href="mailto:{{ site.contact.email }}" target="_blank">{{ site.contact.email }}</a></li>
        <li><a href="#">{{ site.contact.phone }}</a></li>
        <li><a href="{{ site.contact.linkedin }}" target="_blank">LinkedIn</a></li>
      </ul>
    </nav>
  </div>
</footer>
