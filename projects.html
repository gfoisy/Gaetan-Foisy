---
styles:
- styles/projects.css
---
<div class="background-colored">
  <div class="heading">
    <h1>These are some of the <span>projects</span> I have been working on.</h1>
  </div>
</div>

<!-- Cards come from _data/projects.yml -->
<div class="project-panes">
  {%- for project in site.data.projects %}
  <a class="project" href="{{ page.root }}{{ project.page }}">
    <img class="image" src="{{ page.root }}{{ project.image }}" alt="{{ project.alt }}">
    <h2 class="projtag">{{ project.title }}</h2>
  </a>
  {%- endfor %}
</div>
<br>
<p class="thanks">I would like to thank everyone who has helped through all of these projects. I wouldn't have been able to do it without you!</p>
<br>
